<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aguarde...</title>
    <style>
        /* --- SEU CSS ORIGINAL (Mantido) --- */
        body {
            background-color: #222;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: url('MiddleFinger.png'), auto;
            overflow: hidden;
        }

        h1.intro-text {
            font-size: 3em;
            text-transform: uppercase;
            animation: piscar 0.5s infinite alternate;
        }

        @keyframes piscar {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }

        /* --- NOVO CSS DO ANÚNCIO (Modificado) --- */
        
        /* O container agora fica no canto e não cobre a tela */
        #overlay-safado {
            display: none; /* Começa escondido */
            position: fixed;
            bottom: 20px; /* 20px da parte de baixo */
            right: 20px;  /* 20px da direita */
            z-index: 9998;
            /* Removido o fundo preto e a centralização */
        }

        /* A caixa do anúncio com novo estilo */
        .anuncio-box {
            background-color: #ffec00; /* Amarelo */
            border: 4px solid #cc0000; /* Borda vermelha simples */
            padding: 20px;
            max-width: 350px; /* Um pouco menor */
            text-align: center;
            color: #000; /* Texto preto para ler melhor */
            font-family: 'Impact', sans-serif;
            position: relative;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.3); /* Sombra suave */
            /* REMOVIDA A ANIMAÇÃO DE TREMER */
        }

        /* Títulos */
        .anuncio-box h2 {
            font-size: 2rem;
            margin: 0;
            text-transform: uppercase;
            color: #cc0000; /* Vermelho escuro */
            /* Removida a sombra de texto pesada */
        }
        
        .anuncio-box h3 {
            color: #cc0000;
            background: none; /* Sem fundo vermelho */
            display: block;
            padding: 5px 0;
            margin-top: 5px;
            font-size: 1.2rem;
        }

        /* A foto */
        .foto-vitima {
            width: 200px; /* Imagem menor */
            height: 200px;
            object-fit: cover;
            border: 3px solid #cc0000;
            margin: 15px auto;
            display: block;
            background-color: #fff;
        }

        /* Botão REAL de fechar */
        .close-btn {
            position: absolute;
            top: -15px;
            right: -15px;
            background: #cc0000;
            color: white;
            width: 35px;
            height: 35px;
            line-height: 35px;
            border-radius: 50%;
            font-family: Arial, sans-serif;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid white;
            z-index: 9999;
            font-size: 18px;
        }
        
        .close-btn:hover {
            background-color: red;
        }
        
        /* O botão grande de clique */
        .btn-clique {
            padding: 10px 20px;
            font-size: 18px;
            background: #cc0000;
            color: yellow;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            width: 100%;
        }
        
        /* REMOVIDO O @KEYFRAMES TREMER */
    </style>
</head>
<body>

    <div>
        <h1 class="intro-text">Sistema Carregando...</h1>
        <p>(Não feche a página, Solda)</p>
    </div>

    <div id="overlay-safado">
        <div class="anuncio-box">
            <div class="close-btn" onclick="fecharPopup()">X</div>
            
            <h2>ALERTA DE VIADO!</h2>
            <h3>SOLTEIROS DISPONÍVEIS A 500M</h3>
            
            <img id="img-do-anuncio" src="foto1.jpg" alt="Garanhão da Região" class="foto-vitima">
            
            <p style="font-size: 1.3em; font-weight: bold; margin: 15px 0;">"Adoro homens másculos..."</p>
            
            <button class="btn-clique">CLIQUE PARA VER O PERFIL</button>
        </div>
    </div>

    <script>
        // --- CONFIGURAÇÃO ---

        // LISTA DE FOTOS (Nomes exatos dos arquivos)
        const listaDeAmigos = [
            "foto1.png",
            "foto2.png",
            "foto3.jpg"
        ];

        const overlay = document.getElementById('overlay-safado');
        const imagemTag = document.getElementById('img-do-anuncio');

        // Mostra o anúncio e sorteia a foto
        function dispararAnuncio() {
            const indice = Math.floor(Math.random() * listaDeAmigos.length);
            imagemTag.src = listaDeAmigos[indice];
            // Muda para 'block' pois não usamos mais flexbox para centralizar
            overlay.style.display = 'block'; 
            console.log("Anúncio disparado: " + listaDeAmigos[indice]);
        }

        // --- FUNÇÃO DE FECHAR ---
        function fecharPopup() {
            overlay.style.display = 'none';
        }

        // --- TIMERS ---
        setTimeout(dispararAnuncio, 4000); // 4 segundos iniciais
        setInterval(dispararAnuncio, 180000); // Repete a cada 3 minutos

    </script>
</body>
</html>
