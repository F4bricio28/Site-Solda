<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Mestre dos Magos</title> <style>
        body {
            background-color: #ffff00; /* Amarelo doer os olhos */
            font-family: 'Comic Sans MS', 'Comic Sans', cursive; /* Essencial para memes */
            text-align: center;
            color: blue;
        }
        .container {
            margin-top: 50px;
        }
        img {
            border: 5px dashed red;
            width: 300px;
            height: auto;
        }
        .pisca {
            animation: piscar 1s infinite;
            font-size: 2em;
            color: red;
        }
        @keyframes piscar {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="pisca">⚠️ ALERTA DE GÊNIO ⚠️</h1>
        
        <img src="https://media1.tenor.com/m/mXk5rS8dCPEAAAAC/cat-cat-meme.gif" alt="Foto do Amigo">
        
        <h2>Este é [NOME DO AMIGO]</h2>
        <p>Ele disse que sabia consertar a impressora...</p>
        <p><i>"Confia, eu vi um tutorial no YouTube."</i></p>
        
        <br>
        <button onclick="alert('Não tem volta, ele já quebrou tudo!')">Contratar Serviços</button>
    </div>
</body>
</html>
