<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo ao Caos</title>
    <style>
        body {
            /* Uma cor de fundo escura para destacar o cursor */
            background-color: #222;
            color: #00ff00; /* Texto verde estilo hacker */
            font-family: 'Courier New', Courier, monospace; /* Fonte de terminal */
            height: 100vh; /* Garante que a página ocupe a tela toda */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            /* --- A MÁGICA DO CURSOR AQUI --- */
            /* O 'auto' no final é obrigatório como backup caso a imagem falhe */
            /* Substitua o link dentro das aspas pelo link da sua imagem de dedo do meio */
            cursor: url('MiddleFinger.png'), auto;
        }

        h1 {
            font-size: 3em;
            text-transform: uppercase;
            animation: piscar 0.5s infinite alternate;
        }

        @keyframes piscar {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div>
        <h1>Olha o mouse...</h1>
        <p>(É com carinho)</p>
    </div>
</body>
</html>
